<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Concept workflow diagram: request, classify, extract, confidence check, human review, update records, notify, audit log"><title>Concept workflow diagram: request, classify, extract, confidence check, human review, update records, notify, audit log</title><rect width="800" height="600" fill="#E6E6E6"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#0A0A0A"/></marker></defs><text x="40" y="52" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#0A0A0A" text-anchor="start" letter-spacing="1.2">CONNECTED WORKFLOW (CONCEPT)</text><rect x="30" y="110" width="150" height="76" rx="16" fill="#fff" stroke="#0A0A0A" stroke-width="1"/><text x="105.0" y="144.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="0">Request</text><text x="105.0" y="162.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#666" text-anchor="middle" letter-spacing="0">email or form</text><rect x="220" y="110" width="150" height="76" rx="16" fill="#fff" stroke="#0A0A0A" stroke-width="1"/><text x="295.0" y="144.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="0">Classify</text><text x="295.0" y="162.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#666" text-anchor="middle" letter-spacing="0">type and priority</text><rect x="410" y="110" width="150" height="76" rx="16" fill="#fff" stroke="#0A0A0A" stroke-width="1"/><text x="485.0" y="144.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="0">Extract</text><text x="485.0" y="162.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#666" text-anchor="middle" letter-spacing="0">key details</text><rect x="600" y="110" width="170" height="76" rx="16" fill="#fff" stroke="#0A0A0A" stroke-width="1"/><text x="685.0" y="144.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="0">Confidence check</text><text x="685.0" y="162.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#666" text-anchor="middle" letter-spacing="0">is it clear?</text><line x1="180" y1="148" x2="218" y2="148" stroke="#0A0A0A" stroke-width="2"  marker-end="url(#ah)"/><line x1="370" y1="148" x2="408" y2="148" stroke="#0A0A0A" stroke-width="2"  marker-end="url(#ah)"/><line x1="560" y1="148" x2="598" y2="148" stroke="#0A0A0A" stroke-width="2"  marker-end="url(#ah)"/><rect x="600" y="330" width="170" height="76" rx="16" fill="#0A0A0A"/><text x="685.0" y="364.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0">Human review</text><text x="685.0" y="382.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#bbb" text-anchor="middle" letter-spacing="0">person decides</text><rect x="410" y="330" width="150" height="76" rx="16" fill="#fff" stroke="#0A0A0A" stroke-width="1"/><text x="485.0" y="364.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="0">Update records</text><text x="485.0" y="382.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#666" text-anchor="middle" letter-spacing="0">systems of record</text><rect x="220" y="330" width="150" height="76" rx="16" fill="#fff" stroke="#0A0A0A" stroke-width="1"/><text x="295.0" y="364.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="0">Notify team</text><text x="295.0" y="382.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#666" text-anchor="middle" letter-spacing="0">email or chat</text><rect x="30" y="330" width="150" height="76" rx="16" fill="#fff" stroke="#0A0A0A" stroke-width="1"/><text x="105.0" y="364.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="0">Audit log</text><text x="105.0" y="382.0" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#666" text-anchor="middle" letter-spacing="0">who, what, when</text><line x1="700" y1="186" x2="700" y2="328" stroke="#0A0A0A" stroke-width="2"  marker-end="url(#ah)"/><rect x="708" y="244" width="62" height="22" rx="11" fill="#E6E6E6"/><text x="739" y="259" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="0">unclear</text><path d="M640 186V262H485V328" fill="none" stroke="#0A0A0A" stroke-width="2" marker-end="url(#ah)"/><rect x="500" y="250" width="56" height="22" rx="11" fill="#E6E6E6"/><text x="528" y="265" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="0">clear</text><line x1="600" y1="368" x2="562" y2="368" stroke="#0A0A0A" stroke-width="2"  marker-end="url(#ah)"/><line x1="410" y1="368" x2="372" y2="368" stroke="#0A0A0A" stroke-width="2"  marker-end="url(#ah)"/><line x1="220" y1="368" x2="182" y2="368" stroke="#0A0A0A" stroke-width="2"  marker-end="url(#ah)"/><rect x="30" y="450" width="740" height="96" rx="18" fill="#F4F4F4"/><text x="52" y="484" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#0A0A0A" text-anchor="start" letter-spacing="1">HUMAN IN THE LOOP</text><text x="52" y="508" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0A0A0A" text-anchor="start" letter-spacing="0">Uncertain items wait for a person. Clear items continue automatically.</text><text x="52" y="530" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#666" text-anchor="start" letter-spacing="0">Conceptual workflow. Demonstration only.</text></svg>
