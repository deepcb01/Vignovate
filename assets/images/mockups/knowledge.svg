ont-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#0A0A0A" text-anchor="start" letter-spacing="0">How do I request access to</text><rect x="52" y="492" width="676" height="44" rx="22" fill="#fff" stroke="#0A0A0A" stroke-width="1"/><text x="74" y="519" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#666" text-anchor="start" letter-spacing="0">Ask about company knowledge...</text></svg>
