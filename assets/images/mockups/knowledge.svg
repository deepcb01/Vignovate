<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Concept mockup of a knowledge assistant answering from approved internal pages with sources"><title>Concept mockup of a knowledge assistant answering from approved internal pages with sources</title><rect width="800" height="600" fill="#E6E6E6"/><rect x="36" y="36" width="728" height="528" rx="22" fill="#fff" stroke="#C8C8C8" stroke-width="1"/><circle cx="66" cy="64" r="5" fill="#C8C8C8"/><circle cx="84" cy="64" r="5" fill="#C8C8C8"/><circle cx="102" cy="64" r="5" fill="#C8C8C8"/><text x="400" y="68" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#666" text-anchor="middle" letter-spacing="1">KNOWLEDGE ASSISTANT</text><rect x="672" y="52" width="72" height="22" rx="11" fill="#0A0A0A"/><text x="708" y="67" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="9" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.8">CONCEPT</text><line x1="36" y1="90" x2="764" y2="90" stroke="#E6E6E6" stroke-width="1" /><rect x="52" y="106" width="676" height="56" rx="28" fill="#0A0A0A"/><text x="80" y="140" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="0">What is our process for onboarding a new team member?</text><rect x="52" y="182" width="676" height="190" rx="18" fill="#F4F4F4"/><text x="74" y="212" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="start" letter-spacing="0">Answer drawn from approved internal pages</text><text x="74" y="244" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0A0A0A" text-anchor="start" letter-spacing="0">1. Create the accounts listed in the onboarding checklist.</text><text x="74" y="270" font-famil