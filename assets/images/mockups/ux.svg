no-Regular',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#666" text-anchor="start" letter-spacing="0">Helpful?   Yes   No</text><text x="651" y="540" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="0.6">3  ANSWER + APPROVE</text></svg>
