<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Concept mockup of an AI support assistant interface"><title>Concept mockup of an AI support assistant interface</title><rect width="800" height="600" fill="#E6E6E6"/><rect x="36" y="36" width="728" height="528" rx="22" fill="#fff" stroke="#C8C8C8" stroke-width="1"/><circle cx="66" cy="64" r="5" fill="#C8C8C8"/><circle cx="84" cy="64" r="5" fill="#C8C8C8"/><circle cx="102" cy="64" r="5" fill="#C8C8C8"/><text x="400" y="68" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#666" text-anchor="middle" letter-spacing="1">SUPPORT ASSISTANT</text><rect x="672" y="52" width="72" height="22" rx="11" fill="#0A0A0A"/><text x="708" y="67" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="9" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.8">CONCEPT</text><line x1="36" y1="90" x2="764" y2="90" stroke="#E6E6E6" stroke-width="1" /><rect x="52" y="106" width="180" height="440" rx="16" fill="#F4F4F4"/><rect x="62" y="120" width="160" height="34" rx="17" fill="#0A0A0A"/><text x="78" y="142" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#fff" text-anchor="start" letter-spacing="0">Getting started</text><text x="78" y="184" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0A0A0A" text-anchor="start" letter-spacing="0">Account &amp; billing</text><text x="78" y="226" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0A0A0A" text-anchor="start" letter-spacing="0">Integrations</text><text x="78" y="268" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0A0A0A" text-anchor="start" letter-spacing="0">Security</text><text x="78" y="310" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0A0A0A" text-anchor="start" letter-spacing="0">Contact a person</text><rect x="330" y="112" width="400" height="46" rx="18" fill="#0A0A0A"/><text x="348" y="140" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="0">How do I reset my workspace password?</text><rect x="256" y="176" width="474" height="188" rx="18" fill="#F4F4F4"/><text x="274" y="204" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="start" letter-spacing="0">You can reset it from Settings, then Security.</text><text x="274" y="232" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0A0A0A" text-anchor="start" letter-spacing="0">1. Open Settings and choose Security.</text><text x="274" y="256" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0A0A0A" text-anchor="start" letter-spacing="0">2. Select "Reset password".</text><text x="274" y="280" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0A0A0A" text-anchor="start" letter-spacing="0">3. Follow the link sent to your email.</text><rect x="274" y="312" width="190" height="28" rx="14" fill="#fff" stroke="#C8C8C8" stroke-width="1"/><text x="286" y="330" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#0A0A0A" text-anchor="start" letter-spacing="0">Source: Account security guide</text><rect x="256" y="380" width="300" height="40" rx="18" fill="#F4F4F4"/><text x="274" y="404" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0A0A0A" text-anchor="start" letter-spacing="0">Was this helpful?</text><rect x="414" y="389" width="44" height="24" rx="12" fill="#fff" stroke="#0A0A0A" stroke-width="1"/><text x="436" y="405" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="0">Yes</text><rect x="466" y="389" width="78" height="24" rx="12" fill="#fff" stroke="#0A0A0A" stroke-width="1"/><text x="505" y="405" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="0">Talk to us</text><rect x="256" y="490" width="474" height="44" rx="22" fill="#fff" stroke="#0A0A0A" stroke-width="1"/><text x="276" y="517" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#666" text-anchor="start" letter-spacing="0">Ask a question...</text><circle cx="706" cy="512" r="15" fill="#0A0A0A"/><path d="M699 512h14M708 506l6 6-6 6" stroke="#fff" stroke-width="2" fill="none"/></svg>
